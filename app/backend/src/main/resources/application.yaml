spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: pec-events-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    aws:
      secretsmanager:
        enabled: false
      region:
        static: ${AWS_S3_REGION:ap-south-1}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:54324}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

supabase:
  url: ${SUPABASE_URL:http://localhost:54321}
  anon-key: ${SUPABASE_ANON_KEY:sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
  jwt-secret: ${SUPABASE_JWT_SECRET:your-local-jwt-secret}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key-here}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:pec-events-assets-local}
    region: ${AWS_S3_REGION:ap-south-1}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
  cdn:
    url: ${AWS_CDN_URL:http://localhost:9000/pec-events-assets-local}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: "aws & dev"
    import: "aws-secretsmanager:/config/pec-events-api_dev"
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ap-south-1

---
spring:
  config:
    activate:
      on-profile: "aws & staging"
    import: "aws-secretsmanager:/config/pec-events-api_staging"
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ap-south-1

---
spring:
  config:
    activate:
      on-profile: "aws & prod"
    import: "aws-secretsmanager:/config/pec-events-api_prod"
  cloud:
    aws:
      secretsmanager:
        enabled: true
      region:
        static: ap-south-1
