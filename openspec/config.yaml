schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
# Adds tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Project Name: Prathyusha Engineering College's (PEC) Events Notification/Management Web App (pec-events-app)
  Application Type: Progressive Web App (PWA)
  Deployment Domains:
    - Frontend: events.pecdevelopers.com
    - Backend API: api.events.pecdevelopers.com
  
  Domain & Key Purpose:
    - Allow students to discover and register for free and paid events.
    - Enable Faculty Coordinators and Student Coordinators to publish events and manage registrations.
  
  User Roles & Registration Policy:
    - Email Domain Rules: Allow registration with any email domain for all roles, relying on manual validation/coordination by event coordinators.
    - Verification Policy:
      - Phase 1 (V1): Direct user registration and authentication via Supabase Auth (GoTrue). User profiles are synchronized to the local database upon first login. Outgoing password reset / OTP emails are routed via Supabase-configured SMTP providers (e.g. Resend), and SMS/OTP is routed via MSG91 using a custom Deno-based Send SMS Auth Hook.
      - Phase 2 (V2): Sequential dual-channel OTP verification is required during self-registration in Keycloak (IdP) before account creation completes (Email OTP via Resend.com SMTP relay, followed by Phone/SMS OTP via MSG91 custom SPI).
    - Roles:
      1. Student / Participant: Can browse events, register, submit payment confirmation (UPI screenshot + transaction ID), and receive notifications.
      2. Student Coordinator: Can publish events, view/manage registrations, and has full authority to verify/approve payments and registrations.
      3. Faculty Coordinator: Can publish events, view/manage registrations, verify and approve payments/registrations, manage student coordinators, and edit event details.
      4. System Admin: Manage users, roles, system parameters, global settings, audit logs, and infrastructure monitoring.
  
  Tech Stack & Architecture:
    - Phase 1 (V1):
      - Frontend: React (v19) SPA, Zustand, TypeScript, HeroUI v3 + Tailwind CSS v4, React Router v7.
        - Directory layout enforces separation of concerns (3-Tier Architecture):
          - View Layer: `src/components/`, `src/components/ui/`, `src/pages/` for presentation UI. No direct API calls or complex business logic.
          - Data & State Layer: `src/hooks/` for custom hooks, `src/stores/` (Zustand state), `src/data/` for static configuration.
          - API & Service Layer: `src/services/` (strategy pattern/orchestration), `src/api/` (raw Axios calls and types).
      - Backend: Spring Boot backend exposing direct REST endpoints (no gateway). Auth requests are received via `/auth/**` endpoints and proxied to Supabase Auth on the server-side. Utilizes a custom `SupabaseJwtFilter` to decode and validate Supabase JWT signatures symmetrically (using the shared JWT secret) or asymmetrically (using Supabase JWKS public keys).
        - Architecture Style: Decoupled Service Layers (Ports & Adapters).
          - Port Interfaces defined in `service/port/` and implementation classes directly in `service/`.
          - Decoupled model structure: `model/entity/` (JPA entities), `model/dto/` (payload DTOs), `model/enums/`, and `model/converter/`.
          - Segregated controllers: `controller/admin/`, `controller/student/` or `controller/participant/`, `controller/coordinator/`, `controller/shared/`, and a global `controller/advice/ExceptionHandler`.
      - Security: AOP aspect `@RequiresRole` checks request authorization by querying the user role from the local database via `RoleService`.
      - Configuration:
        - Default profile (Scenario A) runs against local PostgreSQL (default port 54322).
        - Active profile `aws` (Scenario B) imports datasource and third-party configuration dynamically from AWS Secrets Manager using Spring Cloud AWS (`/config/pec-events-api_${spring.profiles.active:dev}`).
      - Local Tooling & Mocking:
        - S3 storage emulator using local MinIO (port 9000).
        - Outgoing email/OTP catcher using local Inbucket (port 54324).
      - Database: Managed Supabase Cloud (PostgreSQL).
      - Storage: AWS S3 bucket (or MinIO emulator locally) for user profile images, event assets (posters, banners, event photos), and manual payment receipt uploads.
      - Notifications & Caching: Handled synchronously or using standard Spring `@Async` threads (no Redis or RabbitMQ in V1).
      - Infrastructure: Deployed as standalone containers/VMs (no AWS EKS, Kong Gateway, or Keycloak in V1).
    - Phase 2 (V2):
      - Identity & Gateway: Keycloak (Identity Provider), Kong (API Gateway).
        - Authentication Flow: React frontend authenticates directly against Keycloak via Authorization Code Flow + PKCE (with Keycloak routes exposed under the Kong gateway, e.g., via `/auth/*` paths), stores the JWT, and sends it in the Authorization header to the Kong Gateway, which proxies to Spring Boot backend services.
        - User Sync: Basic user profile details (ID, name, email, department, role) are synchronized from Keycloak to the local PostgreSQL database on first successful login.
      - Caching: Redis cluster deployed in EKS to cache event query listings.
      - Queue: RabbitMQ broker deployed in EKS to asynchronously process push notification dispatches.
      - Storage: AWS S3 bucket for screenshot uploads, provisioned via Terraform and served via CloudFront.
      - Infrastructure: AWS EKS Kubernetes clusters managed via Helm charts, Route 53 DNS, CloudFront CDN, and Terraform.



  
  Design & Aesthetics:
    - SOLID design principles.
    - Component Library: HeroUI v3 (previously NextUI) integrated with Tailwind CSS v4 and React Aria (WCAG compliant).
    - Icon Library: Gravity UI Icons (`@gravity-ui/icons`) for consistent and accessible iconography.
    - Match PEC's official institutional brand identity using maroon red accents (primary color: #a80000).
    - Theme layout: Sleek academic-tech theme, light mode by default with dark mode support, modern typography, smooth gradients, subtle micro-animations, and skeleton screen loading states (using HeroUI skeleton components).


  
  Scale & Concurrency:
    - Estimated peak traffic: 1,000 - 6,000 concurrent devices (target estimate after 4 years of growth).
    - Ticket Overbooking Control: Database row-level locking (`SELECT ... FOR UPDATE` within Spring Boot transactions) to prevent overselling limited event slots under high concurrency.
  
  PWA Notifications:
    - Full Web Push API implemented using Service Workers and VAPID keys from V1 to enable real-time OS-level push notifications even when the app is closed.
  
  Payment Processing Phasing:
    - V1 (Current): Manual payments. System displays a UPI QR code; students pay external to the app and upload a screenshot of the transaction along with transaction details. Coordinators manually verify and approve.
    - V2 (Future): Integration of Razorpay API for direct online payments, plus detailed analytics dashboard for coordinators.
  
  Testing & QA Strategy:
    - Focus Areas: Primarily Unit and Integration testing for both frontend (e.g., Vitest, React Testing Library) and backend (e.g., JUnit, Spring Boot Test).
    - Lifecycle: Follow the Software Testing Life Cycle (STLC) lifecycle. Write test case specifications, design test scenarios, and write/maintain testing documentation first, then implement coding to satisfy those tests (docs-first testing process).
  
  Documentation Requirements:
    - Target Directory: docs/ (relative to workspace root)
    - Documents to Create & Maintain:
      1. BRD (Business Requirements Document): Specifying business requirements, roles, constraints, and V1/V2 phasing.
      2. PRD (Product Requirements Document): Detailing feature specifications, user flows, and product requirements.
      3. HLD (High-Level Design): Explaining the cross-system architecture, networking, authentication flow, and hosting design.
      4. LLD (Low-Level Design): Detailing database schemas, API schema specifications with request/response examples, and software components.
    - Diagram Standards: Use Mermaid syntax for all architecture, flow, and schema diagrams.
    - Sync Rule: All documentation in the docs/ folder must always be kept strictly in sync with the active OpenSpec configuration and system rules.



# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Focus heavily on user registration workflows and UPI verification flows in V1.
    - Maintain a clear distinction between the current UPI verification mechanism and the future V2 Razorpay plan.
  design:
    - Specify the 3-layer architecture for the React frontend (API Layer, Data Layer, View Layer).
    - Detail HeroUI v3 component configuration and Tailwind CSS v4 setup on React 19.
    - Detail the integration between Spring Boot, Keycloak, Kong API Gateway, and PostgreSQL/Supabase.
    - Outline database schema design for events, registrations, user profiles, and payment audit logs.
    - Incorporate AWS S3 upload workflows and Supabase database locking strategy.
    - Ensure BRD, PRD, HLD, and LLD documents (with Mermaid diagrams) are planned in detail and kept fully synchronized.
  tasks:
    - Break tasks down logically: setup/infrastructure, backend API design, Keycloak/Kong setup, frontend layer structure, features, and verification.
    - Include environment setup tasks specifying Helm chart creation and Supabase migration configuration for dev and prod.
    - Enforce the "docs-first testing" workflow following the STLC lifecycle: require test design and documentation creation tasks to be completed before implementing the functional code.
    - Focus verification tasks primarily on Unit and Integration testing.
    - Require tasks for creating and synchronizing BRD, PRD, HLD, and LLD documentation in the docs/ directory.


